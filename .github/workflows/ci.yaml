name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build the example for web
        run: flutter build web --release
        working-directory: example

  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # pana shells out to cwebp/dwebp to validate and thumbnail the images in
      # the pubspec screenshots: block. Without libwebp every screenshot is
      # reported as an issue and the package loses the example/screenshot
      # points.
      - name: Install libwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Install pana
        run: dart pub global activate pana

      - name: Score the package
        run: dart run pana --no-warning --exit-code-threshold 0
