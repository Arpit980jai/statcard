name: Publish to pub.dev

# Publishing is driven entirely by tags: pushing v0.2.0 publishes 0.2.0. There
# is no PUB_TOKEN secret anywhere in this workflow. pub.dev is told to trust
# this repository and this tag pattern, and `dart pub publish` exchanges the
# GitHub OIDC token minted by `id-token: write` for a short-lived credential.
#
# One-time setup on pub.dev, under Admin -> Automated publishing:
#   * Enable publishing from GitHub Actions
#   * Repository:   Arpit980jai/statcard
#   * Tag pattern:  v{{version}}
#
# If you also tick "Require GitHub Actions environment" there, add a matching
# `environment:` key to the job below or the exchange will be refused.

on:
  push:
    tags:
      # Matches v0.2.0 and v1.0.0-beta.1, but not a stray "version-2" tag.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# A tag is immutable, but a re-run is not: never let two publishes race.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # The whole point: lets the job mint the OIDC token pub.dev verifies.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # The tag is what triggered this run, but pubspec.yaml is what actually
      # gets published. If they disagree, stop: a published version can only be
      # retracted within seven days, never deleted.
      - name: Check the tag matches pubspec.yaml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')"
          echo "tag=$TAG pubspec=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION"
            exit 1
          fi

      # Re-run the gate against the tagged commit rather than trusting that the
      # pull request which produced it was green.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Goldens are platform sensitive and the screenshot generator rewrites
      # files under doc/images, which would leave the tree dirty and make
      # `dart pub publish` complain about modified checked-in files.
      #
      # Note the boolean selector: passing --exclude-tags twice does not
      # combine the two, the second silently wins.
      - name: Test
        run: flutter test --exclude-tags "golden || screenshots"

      # `flutter pub get` on 3.47+ rewrites both analysis_options.yaml files
      # ("Upgrading analysis_options.yaml to exclude build and platform
      # directories"), and `flutter analyze` runs pub get again for the example,
      # so the tree is dirty by the time publishing starts. `dart pub publish`
      # refuses to publish from a dirty git state, which is the right default —
      # so restore exactly the files the tool touched, and let anything else it
      # modifies fail loudly.
      - name: Restore files the Flutter tool rewrote
        run: |
          git checkout -- analysis_options.yaml example/analysis_options.yaml
          git status --porcelain

      # `dart pub publish` only attempts the OIDC exchange when the runner has
      # injected these, which happens only if `id-token: write` took effect.
      # Without them it silently falls back to interactive browser OAuth and
      # blocks. Checking presence only — never log the token itself.
      - name: Check OIDC availability
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC request URL: present"
          else
            echo "OIDC request URL: MISSING — id-token: write did not take effect"
          fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC request token: present"
          else
            echo "OIDC request token: MISSING"
          fi

      - name: Dry run
        run: dart pub publish --dry-run

      # --force skips the interactive confirmation, which there is no terminal
      # to answer. It does not skip any server-side validation.
      #
      # The timeout matters: if pub.dev has no OIDC trust configured for this
      # repository, `dart pub publish` falls back to interactive OAuth, prints a
      # URL and waits on stdin that never arrives — which otherwise sits here
      # until the six hour default job timeout.
      - name: Publish
        timeout-minutes: 5
        run: dart pub publish --force
